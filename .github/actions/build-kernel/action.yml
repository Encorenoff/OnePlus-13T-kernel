name: 'Build OnePlus 13T/13S Kernel (BakaSU / SukiSU Nova / KSUN + SUSFS + Epicmann24)'
description: 'Builds OnePlus 13T/13S SM8750 GKI 6.6 kernels'

inputs:
  op_config_json:
    description: 'JSON string containing device config'
    required: true
  ksu_type:
    description: 'Select KSU Variant'
    required: true
  ksu_repo:
    description: 'Resolved GitHub owner/repo for KSU'
    required: false
    default: ""
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash'
    required: false
    default: ""
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash'
    required: false
    default: ""
  nomount_tag:
    description: 'Resolved NoMount release tag'
    required: false
    default: ''
  nomount_sha:
    description: 'Commit SHA of the resolved NoMount release'
    required: false
    default: ''
  epicmann_patches:
    description: 'Apply patches from epicmann24/android_kernel_common_oneplus_sm8750'
    required: false
    default: 'true'
  epicmann_branch:
    description: 'Branch in epicmann24 repo'
    required: false
    default: ''
  epicmann_filter:
    description: 'Category/keyword/SHA filter for epicmann24 patches'
    required: false
    default: 'all'
  enable_kpm:
    description: 'Enable KPM (CONFIG_KPM=y + patch_linux)'
    required: false
    default: 'true'
  build_timestamp:
    description: 'Custom kernel build timestamp for uname -a'
    required: false
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    default: O2
  mlgo:
    description: 'Enable MLGO'
    required: false
    default: 'true'
  clean:
    description: 'Clean build without ccache'
    required: false
    default: 'false'
  debug:
    description: 'Enable debug mode'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  image_sha256:
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  zip_name:
    value: ${{ steps.create_zip.outputs.zip_name }}

runs:
  using: 'composite'
  steps:
    - name: Get Action info
      shell: bash
      env:
        ACTION_REPO_VAL: ${{ github.action_repository }}
        ACTION_REF_VAL: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ACTION_REPO=$ACTION_REPO_VAL" >> "$GITHUB_ENV"
        echo "ACTION_REF=$ACTION_REF_VAL" >> "$GITHUB_ENV"

    - name: 📥 Checkout Action Source
      uses: actions/checkout@v6
      with:
        repository: ${{ env.ACTION_REPO }}
        ref: ${{ env.ACTION_REF }}
        path: action-source
        fetch-depth: 1

    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        jq '.' /tmp/config.json

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$OP_MODEL"
        echo "CONFIG=$OP_MODEL" >> "$GITHUB_ENV"
        git config --global feature.manyFiles true
        git config --global pack.sparse true
        git config --global pack.threads 2
        git config --global http.sslVerify false

    - name: Sync Kernel Source (OnePlus 13T / 13S latest)
      uses: ./action-source/.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Record source sync diagnostics
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'Source sync completed for %s\n' "$OP_MODEL"
          free -h
          df -h "$GITHUB_WORKSPACE"
        } > "$RUNNER_TEMP/kernel-sync-diagnostics.txt"

    - name: Upload source sync diagnostics
      if: ${{ inputs.debug == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: sync-diagnostics-${{ env.OP_MODEL }}-${{ inputs.ksu_type }}
        path: ${{ runner.temp }}/kernel-sync-diagnostics.txt
        retention-days: 3

    - name: Set Dir Paths & Build Tools
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        mkdir -p "$ARTIFACTS_DIR" "$DEBUG_ARTIFACTS_DIR"
        {
          echo "CONFIG_FOLDER=$CONFIG_DIR"
          echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR"
          echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR"
          echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR"
          echo "AK3_FOLDER=$CONFIG_DIR/AnyKernel3"
          echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR"
          echo "KERNEL_PATCHES_FOLDER=$GITHUB_WORKSPACE/kernel_patches"
          echo "SUSFS_FOLDER=$GITHUB_WORKSPACE/susfs4ksu"
          echo "KSUN_FOLDER=$KERNEL_PLATFORM_DIR/KernelSU-Next"
          echo "BUILD_USER=encoren"
          echo "BUILD_HOST=github-actions"
        } >> "$GITHUB_ENV"
        echo "${KERNEL_PLATFORM_DIR}/prebuilts/kernel-build-tools/linux-x86/bin/" >> "$GITHUB_PATH"
        echo "${KERNEL_PLATFORM_DIR}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> "$GITHUB_PATH"

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        BRANCH_LINE=$(grep -h '^[[:space:]]*BRANCH=' build.config.common build.config.constants 2>/dev/null | head -n1 || echo "BRANCH=android15-6.6")
        ANDROID_VERSION="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${ANDROID_VERSION%-*}"
        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"
        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        } >> "$GITHUB_ENV"
        printf "%s-%s\n%s\n" "$ANDROID_VERSION" "$FULL_VERSION" "$OP_OS_VERSION" > "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "✅ Detected kernel: ${FULL_VERSION}-${ANDROID_VERSION}-${OP_UNAME}"

    - name: Setup Clang Toolchain
      shell: bash
      run: |
        set -euo pipefail
        CLANG_BIN=""
        if [ -n "${OP_ZYC_COMPILER:-}" ]; then
          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          mkdir -p "$ZYC_DIR"
          curl -L --fail --retry 3 --retry-max-time 360 --connect-timeout 20 --max-time 180 -o "$CONFIG_FOLDER/compiler.tar.gz" "$OP_ZYC_COMPILER"
          tar -xzf "$CONFIG_FOLDER/compiler.tar.gz" -C "$ZYC_DIR"
          rm -f "$CONFIG_FOLDER/compiler.tar.gz"
          [ -x "$ZYC_DIR/bin/clang" ] && CLANG_BIN="$ZYC_DIR/bin"
        fi
        if [ -z "$CLANG_BIN" ] && [ -n "${OP_C_COMPILER:-}" ] && [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
          CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
        fi
        if [ -z "$CLANG_BIN" ]; then
          latest=$(ls -d "$KERNEL_PLATFORM_FOLDER/prebuilts/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
          [ -n "$latest" ] && CLANG_BIN="$latest/bin"
        fi
        [ -n "$CLANG_BIN" ] || { echo "::error::No clang found"; exit 1; }
        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> "$GITHUB_PATH"
        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        short="$("$CLANG_BIN/clang" --version | sha256sum | cut -c1-8)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
        echo "✅ Using Clang: $CLANG_VERSION"

    - name: Restore ccache
      uses: ./action-source/.github/actions/cache/restore
      if: ${{ inputs.clean == false || inputs.clean == 'false' }}
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v4-${{ env.OP_MODEL }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v4-${{ env.OP_MODEL }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v4-${{ env.OP_MODEL }}-

    - name: Prepare ccache
      shell: bash
      run: |
        set -euo pipefail
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        ccache -z || true
        sed -i "1i // CI_RUN_ID: ${{ github.run_id }}" "$COMMON_KERNEL_FOLDER/kernel/configs.c"
        sed -i "1i // ccache:disable" "$COMMON_KERNEL_FOLDER/kernel/configs.c"

    - name: Fetch WildKernels Patches & Latest SUSFS
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch main https://github.com/WildKernels/kernel_patches.git "$KERNEL_PATCHES_FOLDER"

        if [ "${{ env.OP_SUSFS }}" = "true" ]; then
          SUSFS_REF="${{ inputs.susfs_commit_hash_or_branch }}"
          if [ -z "$SUSFS_REF" ] || [ "$SUSFS_REF" = "none" ]; then
            SUSFS_REF="gki-android15-6.6"
          fi
          mkdir -p "$SUSFS_FOLDER"
          curl -LfsS --retry 5 "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/archive.tar.gz?sha=${SUSFS_REF}" \
            | tar -xz -C "$SUSFS_FOLDER" --strip-components=1
          echo "SUSFS_COMMIT_SHA=$SUSFS_REF" >> "$GITHUB_ENV"
          echo "✅ SUSFS synced ($SUSFS_REF)"
        fi

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true

    - name: Add BakaSU (ReSukiSU)
      if: ${{ inputs.ksu_type == 'BAKASU' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        KSU_REPO="${{ inputs.ksu_repo }}"
        [ -z "$KSU_REPO" ] && KSU_REPO="Baka-SU/BakaSU"
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        KSU_REF="${KSU_INPUT:-main}"
        (curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_REF}/kernel/setup.sh" \
          || curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/${KSU_REPO}/main/kernel/setup.sh") \
          | bash -s "$KSU_REF"
        KSU_SRC=$(find "$KERNEL_PLATFORM_FOLDER" -maxdepth 2 -type d \( -name "BakaSU" -o -name "ReSukiSU" -o -name "KernelSU" \) | head -n1)
        cd "$KSU_SRC"
        KSU_SHA=$(git rev-parse HEAD)
        KSU_VER=$(( $(git rev-list --count HEAD) + 10200 ))
        {
          echo "KSU_FOLDER=$KSU_SRC"
          echo "KSU_COMMIT_SHA=$KSU_SHA"
          echo "KSUVER=$KSU_VER"
          echo "NEED_HOOKS=false"
        } >> "$GITHUB_ENV"
        echo "CONFIG_KSU=y" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        if [ "${{ inputs.enable_kpm }}" = "true" ] && grep -q "config KPM" "$KSU_SRC/kernel/Kconfig" 2>/dev/null; then
          cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KPM=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        EOF
        fi
        printf "BAKASU\n%s\n" "$KSU_VER" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "✅ BakaSU v${KSU_VER} (${KSU_REPO}@${KSU_SHA:0:8})"

    - name: Add SukiSU Nova (SukiSU Ultra)
      if: ${{ inputs.ksu_type == 'SUKISU_NOVA' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        KSU_REPO="${{ inputs.ksu_repo }}"
        [ -z "$KSU_REPO" ] && KSU_REPO="SukiSU-Nova/SukiSU-Nova"
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        KSU_REF="${KSU_INPUT:-main}"
        (curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_REF}/kernel/setup.sh" \
          || curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/${KSU_REPO}/main/kernel/setup.sh") \
          | bash -s "$KSU_REF"
        KSU_SRC=$(find "$KERNEL_PLATFORM_FOLDER" -maxdepth 2 -type d \( -name "SukiSU-Nova" -o -name "SukiSU-Ultra" -o -name "KernelSU" \) | head -n1)
        cd "$KSU_SRC"
        KSU_SHA=$(git rev-parse HEAD)
        KSU_VER=$(( $(git rev-list --count HEAD) + 10606 ))
        {
          echo "KSU_FOLDER=$KSU_SRC"
          echo "KSU_COMMIT_SHA=$KSU_SHA"
          echo "KSUVER=$KSU_VER"
          echo "NEED_HOOKS=false"
        } >> "$GITHUB_ENV"
        echo "CONFIG_KSU=y" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        if [ "${{ inputs.enable_kpm }}" = "true" ]; then
          cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KPM=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        EOF
        fi
        printf "SUKISU_NOVA\n%s\n" "$KSU_VER" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "✅ SukiSU Nova v${KSU_VER} (${KSU_REPO}@${KSU_SHA:0:8})"

    - name: Add KernelSU Next
      if: ${{ inputs.ksu_type == 'KSUN' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        KSU_REPO="${{ inputs.ksu_repo }}"
        [ -z "$KSU_REPO" ] && KSU_REPO="KernelSU-Next/KernelSU-Next"
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        KSU_REF="${KSU_INPUT:-dev}"
        curl --fail --location --proto '=https' --retry 3 --connect-timeout 10 --max-time 45 -sS \
          "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_REF}/kernel/setup.sh" \
          -o "$RUNNER_TEMP/ksun-setup.sh"
        bash "$RUNNER_TEMP/ksun-setup.sh" "$KSU_REF"
        if [[ "$KSU_REF" =~ ^[a-f0-9]{40}$ ]] && [ "$(git -C "$KSUN_FOLDER" rev-parse HEAD)" != "$KSU_REF" ]; then
          echo "::error::KernelSU Next checkout does not match $KSU_REF"
          exit 1
        fi
        cd "$KSUN_FOLDER/kernel"
        COMMITS_COUNT=$(git rev-list --count HEAD)
        BASE_VERSION=30000
        [ "$COMMITS_COUNT" -lt 2684 ] && BASE_VERSION=10200
        KSU_VER=$(( COMMITS_COUNT + BASE_VERSION ))
        sed -i "s/DKSU_VERSION=11998/DKSU_VERSION=${KSU_VER}/" Makefile 2>/dev/null || true
        [ -f ksu.c ] && sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c || true
        cd "$KSUN_FOLDER"
        KSU_SHA=$(git rev-parse HEAD)
        {
          echo "KSU_FOLDER=$KSUN_FOLDER"
          echo "KSU_COMMIT_SHA=$KSU_SHA"
          echo "KSUVER=$KSU_VER"
          echo "NEED_HOOKS=false"
        } >> "$GITHUB_ENV"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        EOF
        printf "KSUN\n%s\n" "$KSU_VER" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "✅ KernelSU Next v${KSU_VER} (${KSU_REPO}@${KSU_SHA:0:8})"

    - name: Apply Latest SUSFS Patches
      if: ${{ env.OP_SUSFS == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cp "$SUSFS_FOLDER/kernel_patches/fs/"* "$COMMON_KERNEL_FOLDER/fs/"
        cp "$SUSFS_FOLDER/kernel_patches/include/linux/"* "$COMMON_KERNEL_FOLDER/include/linux/"

        susfs_version=$(grep '#define SUSFS_VERSION' "$COMMON_KERNEL_FOLDER/include/linux/susfs.h" | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> "$GITHUB_ENV"
        echo "$susfs_version" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "✅ SUSFS Version: $susfs_version"

        if grep -qxF 'config KSU_SUSFS' "$KSU_FOLDER/kernel/Kconfig"; then
          echo "KernelSU source already supports built-in SUSFS"
        elif [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
          echo "::error::This KernelSU Next revision lacks built-in SUSFS support. Use a dev-susfs revision for this build."
          exit 1
        else
          cd "$KSU_FOLDER"
          patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
          FIX_VER_DIR="$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version"
          [ -d "$FIX_VER_DIR" ] || FIX_VER_DIR=$(ls -d "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches"/v* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$FIX_VER_DIR" ] && [ -d "$FIX_VER_DIR" ]; then
            for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
              [ -f "$FIX_VER_DIR/fix_$file.patch" ] && patch -p1 --forward < "$FIX_VER_DIR/fix_$file.patch" || true
            done
            [ -f "$FIX_VER_DIR/overwrite_hook_mode.patch" ] && patch -p1 --forward < "$FIX_VER_DIR/overwrite_hook_mode.patch" || true
            [ -f "$FIX_VER_DIR/ksu_toolkit.patch" ] && patch -p1 --forward < "$FIX_VER_DIR/ksu_toolkit.patch" || true
          fi
          find ./kernel -name "*.rej" -delete || true
        fi

        cd "$COMMON_KERNEL_FOLDER"
        COMPAT_PY="${GITHUB_WORKSPACE}/action-source/scripts/kernel_fix_patches/apply_kernel_compat.py"
        COMPAT_STATE="${RUNNER_TEMP}/susfs-compat-state.json"
        KMI="${ANDROID_VER}-${KERNEL_VER}"
        SUBLEVEL="${TKERNEL_VER##*.}"
        MAIN_PATCH="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_KERNEL_BRANCH}.patch"

        python3 "$COMPAT_PY" --stage 1 --root "$COMMON_KERNEL_FOLDER" --kmi "$KMI" --sublevel "$SUBLEVEL" --soc "$OP_SOC" --state "$COMPAT_STATE"

        # The kernel source comes from an archive inside a separate Git checkout.
        export GIT_CEILING_DIRECTORIES="$KERNEL_PLATFORM_FOLDER"
        if ! grep -qxF 'extern void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end);' include/linux/page_size_compat.h 2>/dev/null; then
          FOLD_PATCH="$KERNEL_PATCHES_FOLDER/common/backports/fold_fixup_entries.patch"
          if git apply --check -- "$FOLD_PATCH"; then
            git apply -- "$FOLD_PATCH"
          fi
        fi

        FIX_ROOT="$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches"
        FIX_NAME="fix_50_add_susfs_in_${SUSFS_KERNEL_BRANCH}.patch"
        FIX_PATCH="$FIX_ROOT/$susfs_version/$FIX_NAME"
        if [ ! -f "$FIX_PATCH" ] && [ -d "$FIX_ROOT" ]; then
          FIX_PATCH=$(find "$FIX_ROOT" -name "$FIX_NAME" | sort -V | tail -n1)
        fi

        # OnePlus 6.6.118 has different outer context in show_smap().
        # Try the complete patch with two context lines if exact matching fails.
        SUSFS_PATCH=""
        for context in '' -C2; do
          context_args=()
          if [ -n "$context" ]; then
            context_args+=("$context")
          fi
          for candidate in "$MAIN_PATCH" "$FIX_PATCH"; do
            [ -f "$candidate" ] || continue
            if git apply --check --reverse "${context_args[@]}" -- "$candidate" 2>/dev/null; then
              echo "SUSFS patch already present: $(basename "$candidate")"
            elif git apply --check "${context_args[@]}" -- "$candidate" 2>/dev/null; then
              git apply "${context_args[@]}" -- "$candidate"
            else
              continue
            fi
            SUSFS_PATCH="$candidate"
            break 2
          done
        done
        if [ -z "$SUSFS_PATCH" ]; then
          echo "::error::No complete SUSFS kernel patch applies to ${OP_MODEL} (${TKERNEL_VER})"
          git apply --check -C2 -- "$MAIN_PATCH" || true
          exit 1
        fi

        protected_paths="$RUNNER_TEMP/susfs-protected-paths.txt"
        {
          git apply --numstat -- "$SUSFS_PATCH" | cut -f3-
          printf '%s\n' arch/arm64/configs/gki_defconfig drivers/Kconfig drivers/Makefile \
            include/linux/page_size_compat.h mm/page_size_compat.c
        } | sort -u > "$protected_paths"
        echo "SUSFS_PROTECTED_PATHS_FILE=$protected_paths" >> "$GITHUB_ENV"

        python3 "$COMPAT_PY" --stage 2 --root "$COMMON_KERNEL_FOLDER" --kmi "$KMI" --sublevel "$SUBLEVEL" --soc "$OP_SOC" --state "$COMPAT_STATE"

        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        EOF

    - name: Apply BBRv3 backport
      if: ${{ env.OP_BBR3 == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        export GIT_CEILING_DIRECTORIES="$KERNEL_PLATFORM_FOLDER"
        bbr3_patch="$KERNEL_PATCHES_FOLDER/common/bbrv3/0001-net-tcp-backport-BBRv3-to-${ANDROID_VER}-${KERNEL_VER}.patch"

        has_bbr3() {
          [ -s net/ipv4/tcp_bbr3.c ] && grep -qxF 'config TCP_CONG_BBR3' net/ipv4/Kconfig &&
            grep -qF '$(CONFIG_TCP_CONG_BBR3)' net/ipv4/Makefile
        }
        if ! has_bbr3; then
          git apply --whitespace=nowarn -C2 -- "$bbr3_patch"
        fi
        if ! has_bbr3; then
          echo "::error::BBRv3 source or Kbuild registration is missing"
          exit 1
        fi

        protected_paths="$RUNNER_TEMP/bbr3-protected-paths.txt"
        git apply --numstat -- "$bbr3_patch" | cut -f3- | sort -u > "$protected_paths"
        echo "BBR3_PROTECTED_PATHS_FILE=$protected_paths" >> "$GITHUB_ENV"
        echo "BBRv3 ready before Epicmann24 patches"

    - name: 🧩 Apply Epicmann24 SM8750 Patches
      if: ${{ inputs.epicmann_patches == true || inputs.epicmann_patches == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail
        bash "${GITHUB_WORKSPACE}/action-source/scripts/apply_epicmann24_patches.sh" \
          "$COMMON_KERNEL_FOLDER" \
          "${RUNNER_TEMP}/epicmann_work" \
          "${{ inputs.epicmann_branch }}" \
          "${{ inputs.epicmann_filter }}" \
          "$OP_MODEL" \
          "$GITHUB_STEP_SUMMARY"

    - name: Add BBG LSM
      if: ${{ env.OP_BBG == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main || true
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

    - name: Apply OnePlus SM8750 Patches (HMBIRD, Module Overlay, Opt, NTSync, DS)
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        export GIT_CEILING_DIRECTORIES="$KERNEL_PLATFORM_FOLDER"

        apply_optional_patch() {
          local patch_file="$1"
          local name="${patch_file##*/}"
          local result
          shift
          if git apply --check --reverse "$@" -- "$patch_file" >/dev/null 2>&1; then
            echo "[patch] Already present: $name"
          elif result=$(git apply "$@" -- "$patch_file" 2>&1); then
            echo "[patch] Applied: $name"
          else
            echo "::warning::Skipping incompatible optional patch $name"
            printf '%s\n' "$result"
            return 1
          fi
        }

        if [ "$OP_HMBIRD" = "true" ]; then
          HMBIRD_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird"
          if [ ! -f drivers/of/overwriter/overwrite_config_loader.c ] && [ -f "$HMBIRD_DIR/overwriter.patch" ]; then
            dos2unix "$HMBIRD_DIR/overwriter.patch"
            apply_optional_patch "$HMBIRD_DIR/overwriter.patch" -C2 || true
          fi
          if [ -f drivers/of/overwriter/overwrite_configs/convert_configs.sh ] && [ -f "$HMBIRD_DIR/hmbird_config.patch" ]; then
            chmod +x drivers/of/overwriter/overwrite_configs/convert_configs.sh
            dos2unix "$HMBIRD_DIR/hmbird_config.patch"
            apply_optional_patch "$HMBIRD_DIR/hmbird_config.patch" -C2 || true
          fi
        fi

        # Module overlay (с исправленным копированием модулей: -n вместо -z)
        OVERLAY_PATCH="$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/0001-module-Add-module-intercept-and-overlay-mechanism-${ANDROID_VER}-${KERNEL_VER}.patch"
        if apply_optional_patch "$OVERLAY_PATCH" -C2 && [ -d "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/modules" ]; then
          if [ -f kernel/module/module_overlay/convert_overlay.sh ]; then
            chmod +x kernel/module/module_overlay/convert_overlay.sh
          fi
          SOC="${OP_BRANCH#*/}"
          copied_modules=""
          declare -A selected_file=()
          declare -A selected_priority=()
          suffixes=(
            "_${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
            "_${SOC}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
            "_${OP_MODEL}_${OP_OS_VERSION}.ko"
            "_${SOC}_${OP_OS_VERSION}.ko"
            "_${OP_MODEL}.ko"
            "_${SOC}.ko"
            "_${KERNEL_FULL_VER}.ko"
          )
          while IFS= read -r -d '' file; do
            filename="${file##*/}"
            module_name=""
            priority=0
            exact_module_name=$(modinfo -F name "$file" 2>/dev/null || true)
            for i in "${!suffixes[@]}"; do
              suffix="${suffixes[$i]}"
              if [[ "$filename" == *"$suffix" ]]; then
                extracted_name="${filename%"$suffix"}"
                extracted_normalized="${extracted_name//-/_}"
                if [[ "$extracted_normalized" == "$exact_module_name" ]]; then
                  module_name="$extracted_name"
                  priority=$((i + 1))
                fi
                break
              fi
            done
            [[ -n "$module_name" ]] || continue
            if [[ -z "${selected_priority[$module_name]+exists}" ]] || (( priority < selected_priority["$module_name"] )); then
              selected_file["$module_name"]="$file"
              selected_priority["$module_name"]="$priority"
            fi
          done < <(find "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/modules/" -type f -name '*.ko' -print0)

          for module_name in "${!selected_file[@]}"; do
            file="${selected_file[$module_name]}"
            dest_path=""
            if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/" ]; then
              dest_path="$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/${module_name}.ko"
            elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/" ]; then
              dest_path="$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/${module_name}.ko"
            fi
            if [ -n "$dest_path" ]; then
              cp -v -- "$file" "$dest_path"
              copied_modules="${copied_modules:+${copied_modules}:}${dest_path}"
            fi
          done
          [ -n "$copied_modules" ] && ccache --set-config=extra_files_to_hash="$copied_modules" || true
        fi

        if [ "$OP_OPT" = "true" ]; then
          for p in file_struct_8bytes_align reduce_cache_pressure mem_opt_prefetch optimise_memcmp \
                   int_sqrt reduce_gc_thread_sleep_time add_timeout_wakelocks_globally adjust_cpu_scan_order \
                   disable_cache_hot_buddy f2fs_enlarge_min_fsync_blocks increase_ext4_default_commit_age \
                   reduce_pci_pme_wakeups silence_irq_cpu_logspam silence_system_logspam; do
            apply_optional_patch "$KERNEL_PATCHES_FOLDER/common/${p}.patch" -C2 || true
          done
        fi

        if [ "$OP_NTSYNC" = "true" ]; then
          NTSYNC_DIR="$KERNEL_PATCHES_FOLDER/common/ntsync"
          NTSYNC_COMPAT="$NTSYNC_DIR/ntsync_compat_${ANDROID_VER}-${KERNEL_VER}.patch"
          [ -f "$NTSYNC_DIR/ntsync_compat_${ANDROID_VER}-${KERNEL_VER}_${OP_OS_VERSION}.patch" ] && NTSYNC_COMPAT="$NTSYNC_DIR/ntsync_compat_${ANDROID_VER}-${KERNEL_VER}_${OP_OS_VERSION}.patch"
          if [ ! -f drivers/misc/ntsync.c ]; then
            apply_optional_patch "$NTSYNC_DIR/ntsync_base.patch" -C2 || true
          fi
          if [ -f drivers/misc/ntsync.c ] && [ -f include/uapi/linux/ntsync.h ]; then
            if ! grep -qxF 'config NTSYNC' drivers/misc/Kconfig ||
               ! grep -qF '$(CONFIG_NTSYNC)' drivers/misc/Makefile; then
              apply_optional_patch "$NTSYNC_COMPAT" -C2 || true
            fi
            if grep -qxF 'config NTSYNC' drivers/misc/Kconfig &&
               grep -qF '$(CONFIG_NTSYNC)' drivers/misc/Makefile; then
              scripts/config --file arch/arm64/configs/gki_defconfig -e NTSYNC
            fi
          fi
        fi

        if [ "$OP_UNICODE" = "true" ]; then
          apply_optional_patch "$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1+.patch" -C2 || true
        fi

        if [ "$OP_DS" = "true" ]; then
          apply_optional_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch" -C2 || true
          cat >> arch/arm64/configs/gki_defconfig <<EOF
        CONFIG_SYSVIPC=y
        CONFIG_DEVTMPFS=y
        CONFIG_PID_NS=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_IP_NF_TARGET_REJECT=y
        CONFIG_IP6_NF_TARGET_REJECT=y
        CONFIG_NETFILTER_XT_TARGET_LOG=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        CONFIG_USER_NS=y
        CONFIG_MACVLAN=y
        EOF
        fi

        cat >> arch/arm64/configs/gki_defconfig <<EOF
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y
        CONFIG_NET_SCH_CAKE=y
        CONFIG_NET_SCH_PIE=y
        CONFIG_NET_SCH_FQ_PIE=y
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        CONFIG_BPF_STREAM_PARSER=y
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_LIST_SET=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_SET=y
        CONFIG_IP6_NF_NAT=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        CONFIG_OPTIMIZE_INLINING=y
        CONFIG_FRAME_WARN=0
        CONFIG_TRACEPOINTS=y
        EOF

        if apply_optional_patch "$KERNEL_PATCHES_FOLDER/common/fake_config.patch" -C2; then
          echo "CONFIG_FAKE_DISABLE=CONFIG_TCP_CONG_ADVANCED CONFIG_IP6_NF_NAT" >> "$GITHUB_ENV"
        fi

    - name: Integrate NoMount into the kernel
      if: ${{ inputs.nomount_tag != '' }}
      shell: bash
      env:
        NOMOUNT_TAG: ${{ inputs.nomount_tag }}
        NOMOUNT_SHA: ${{ inputs.nomount_sha }}
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        checkout=$(mktemp -d "$RUNNER_TEMP/nomount.XXXXXX")
        trap 'rm -rf -- "$checkout"' EXIT
        git -c http.sslVerify=true clone --depth 1 --single-branch --branch "$NOMOUNT_TAG" \
          https://github.com/maxsteeel/nomount.git "$checkout"
        if [ "$(git -C "$checkout" rev-parse HEAD)" != "$NOMOUNT_SHA" ]; then
          echo "::error::NoMount tag no longer points to the resolved release commit"
          exit 1
        fi

        mkdir -p fs/nomount
        cp -a "$checkout/kernel/src/." fs/nomount/
        grep -qxF 'source "fs/nomount/Kconfig"' fs/Kconfig || printf '\nsource "fs/nomount/Kconfig"\n' >> fs/Kconfig
        grep -qxF 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
        echo "NOMOUNT_VERSION=$NOMOUNT_TAG" >> "$GITHUB_ENV"
        printf 'NoMount %s (%s)\n' "$NOMOUNT_TAG" "$NOMOUNT_SHA" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"

    - name: Record patched source diagnostics
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'Device: %s\nKernel: %s\nKernelSU: %s\nSUSFS: %s\nNoMount: %s\n' \
            "$OP_MODEL" "$TKERNEL_VER" "$KSU_COMMIT_SHA" "${SUSVER:-off}" "${NOMOUNT_VERSION:-off}"
          printf 'BBRv3 requested: %s\n' "${OP_BBR3:-false}"
          free -h
          df -h "$COMMON_KERNEL_FOLDER"
        } > "$RUNNER_TEMP/kernel-source-diagnostics.txt"

    - name: Upload patched source diagnostics
      if: ${{ inputs.debug == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: source-diagnostics-${{ env.OP_MODEL }}-${{ inputs.ksu_type }}
        path: ${{ runner.temp }}/kernel-source-diagnostics.txt
        retention-days: 3

    - name: 🏷️ Customize Kernel Branding (6.6.xxx-android15-encoren)
      shell: bash
      run: |
        set -euo pipefail
        CUSTOM_LOCALVERSION="-${ANDROID_VER}-${OP_UNAME}"
        echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"
        echo "✅ Target kernel version string: ${TKERNEL_VER}${CUSTOM_LOCALVERSION}"

    - name: 🔨 Compile Kernel
      id: build_kernel_step
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"
        : > "$COMMON_KERNEL_FOLDER/.scmversion"

        WORKSPACE="${GITHUB_WORKSPACE}"
        KCFLAGS="-fdebug-prefix-map=${WORKSPACE}=. -fmacro-prefix-map=${WORKSPACE}=. -ffile-prefix-map=${WORKSPACE}=. -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        if [ "${{ inputs.mlgo }}" = "true" ]; then
          if printf 'int f(int a){return a+1;}\n' | clang --target=aarch64-linux-gnu -O2 -mllvm -regalloc-enable-advisor=release -x c - -c -o /dev/null 2>/dev/null; then
            KCFLAGS="$KCFLAGS -mllvm -regalloc-enable-advisor=release"
          fi
        fi

        export LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
        export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
        export CC="ccache clang" CXX="ccache clang++" HOSTCC="ccache clang" HOSTCXX="ccache clang++"
        export KBUILD_BUILD_USER="${BUILD_USER:-encoren}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-github-actions}"
        export KBUILD_BUILD_VERSION=1
        export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
        [ -z "$KBUILD_BUILD_TIMESTAMP" ] && export KBUILD_BUILD_TIMESTAMP="$(date -u)"

        build_jobs=$(nproc)
        memory_jobs=$(awk '/^MemAvailable:/ { print int($2 / (2 * 1024 * 1024)) }' /proc/meminfo)
        build_jobs=$(( build_jobs < memory_jobs ? build_jobs : memory_jobs ))
        build_jobs=$(( build_jobs > 0 ? build_jobs : 1 ))
        export THINLTO_JOBS=$(( build_jobs < 2 ? build_jobs : 2 ))
        printf 'Build workers: %s, ThinLTO workers: %s\n' "$build_jobs" "$THINLTO_JOBS"
        free -h
        df -h "$PWD"

        cat << 'LDW' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
        #!/bin/bash
        exec ld.lld "$@" --thinlto-jobs="$THINLTO_JOBS"
        LDW
        chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"

        OUT=out
        mkdir -p "$OUT"
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" gki_defconfig

        scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${CUSTOM_LOCALVERSION}"
        scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
        sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion || true
        sed -i 's/echo "-dirty"/echo ""/' scripts/setlocalversion || true

        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-mcpu=oryon-1 -O3"
        else
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-mcpu=oryon-1 -O2"
        fi

        scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -e LTO_CLANG_THIN
        if [ -n "${NOMOUNT_VERSION:-}" ]; then
          scripts/config --file "$OUT/.config" -e NOMOUNT
        fi
        if [ "${OP_BBR3:-false}" = "true" ]; then
          scripts/config --file "$OUT/.config" -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e TCP_CONG_BBR3
        fi
        make LD="$COMMON_KERNEL_FOLDER/ld-wrapper" HOSTLD="$COMMON_KERNEL_FOLDER/ld-wrapper" O="$OUT" olddefconfig
        if [ "${OP_BBR3:-false}" = "true" ] && ! grep -qxF 'CONFIG_TCP_CONG_BBR3=y' "$OUT/.config"; then
          echo "::error::CONFIG_TCP_CONG_BBR3=y is missing from the final kernel config"
          exit 1
        fi
        if [ "${OP_SUSFS:-false}" = "true" ] && ! grep -qxF 'CONFIG_KSU_SUSFS=y' "$OUT/.config"; then
          echo "::error::CONFIG_KSU_SUSFS=y is missing from the final kernel config"
          exit 1
        fi
        if [ -n "${NOMOUNT_VERSION:-}" ] && ! grep -qxF 'CONFIG_NOMOUNT=y' "$OUT/.config"; then
          echo "::error::CONFIG_NOMOUNT=y is missing from the final kernel config"
          exit 1
        fi

        KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
        KCPPFLAGS="-fdebug-prefix-map=${WORKSPACE}=. -fmacro-prefix-map=${WORKSPACE}=. -ffile-prefix-map=${WORKSPACE}=. -DCONFIG_OPTIMIZE_INLINING"

        build_args=(
          "LD=$COMMON_KERNEL_FOLDER/ld-wrapper" "HOSTLD=$COMMON_KERNEL_FOLDER/ld-wrapper"
          "-j$build_jobs" "O=$OUT" "KCFLAGS=$KCFLAGS" "KCPPFLAGS=$KCPPFLAGS"
          "CONFIG_FAKE_DISABLE=${CONFIG_FAKE_DISABLE:-}"
        )
        build_command=(make)
        if [ "${{ inputs.debug }}" = "true" ]; then
          build_command=(timeout --kill-after=30s 38m make)
        fi

        BUILD_START=$(date +%s)
        if "${build_command[@]}" "${build_args[@]}" Image 2>&1 | tee build.log; then
          :
        else
          compile_status=${PIPESTATUS[0]}
          if [ "$compile_status" -eq 124 ]; then
            echo "::error::Diagnostic compilation reached its 38-minute limit. See the compilation log artifact."
          fi
          free -h
          df -h "$PWD"
          exit "$(( compile_status == 0 ? 1 : compile_status ))"
        fi
        BUILD_END=$(date +%s)
        echo "BUILD_TIME=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        [ -f "$IMG" ] || { echo "::error::Image not built"; tail -n 80 build.log; exit 1; }
        if [ "${OP_BBR3:-false}" = "true" ]; then
          if [ ! -s "$OUT/net/ipv4/tcp_bbr3.o" ]; then
            echo "::error::BBRv3 object was not built"
            exit 1
          fi
          echo "BBRv3 built into the kernel (CONFIG_TCP_CONG_BBR3=y)"
        fi

        if [ "${{ inputs.enable_kpm }}" = "true" ] && grep -q "^CONFIG_KPM=y" "$OUT/.config"; then
          echo "🔧 Patching Image with SukiSU patch_linux for KPM..."
          cd "$OUT/arch/arm64/boot"
          PATCH_URL=$(curl -fsSL "https://api.github.com/repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest" \
            | jq -r '.assets[] | select(.name == "patch_linux") | .browser_download_url' | head -n1 || true)
          [ -z "$PATCH_URL" ] && PATCH_URL=$(curl -fsSL "https://api.github.com/repos/ShirkNeko/SukiSU_KernelPatch_patch/releases/latest" \
            | jq -r '.assets[] | select(.name == "patch_linux") | .browser_download_url' | head -n1 || true)
          if [ -n "$PATCH_URL" ]; then
            curl -LfsS "$PATCH_URL" -o patch_linux
            chmod +x patch_linux
            ./patch_linux
            if [ -f oImage ]; then
              mv -f oImage Image
              echo "✅ KPM patch_linux applied successfully"
            fi
            rm -f patch_linux
          else
            echo "::warning::Could not download patch_linux; Image left unpatched for KPM"
          fi
        fi

    - name: Upload failed compilation log
      if: ${{ failure() && steps.build_kernel_step.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: compile-log-${{ env.OP_MODEL }}-${{ inputs.ksu_type }}
        path: ${{ env.COMMON_KERNEL_FOLDER }}/build.log
        if-no-files-found: ignore
        retention-days: 3

    - name: Save Build Metadata & Validate Image
      id: save_metadata
      shell: bash
      run: |
        set -euo pipefail
        echo "kernel_version=${TKERNEL_VER}${CUSTOM_LOCALVERSION}" >> "$GITHUB_OUTPUT"
        echo "ksu_version=${KSUVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "ksu_type=${{ inputs.ksu_type }}" >> "$GITHUB_OUTPUT"
        echo "susfs_version=${SUSVER:-none}" >> "$GITHUB_OUTPUT"

    - name: Collect Stats
      id: collect_stats
      shell: bash
      run: |
        set -euo pipefail
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        file "$IMG" | grep -qi ARM64 || { echo "::error::Invalid ARM64 Image"; exit 1; }
        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
        echo "image_sha256=$IMG_SHA256" >> "$GITHUB_OUTPUT"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"
        echo "✅ Built uname: $KERNEL_UNAME"

    - name: Create AnyKernel3 ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        cp "$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image" "$AK3_FOLDER/Image"
        mv "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt" "$AK3_FOLDER/" || true
        cd "$AK3_FOLDER"
        sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh || true

        if [ "${{ env.OP_SUSFS }}" = "true" ]; then
          ZIP_NAME="AK3_${OP_MODEL}_${TKERNEL_VER}-${ANDROID_VER}-${OP_UNAME}_${{ inputs.ksu_type }}_${KSUVER:-latest}_SuSFS_${SUSVER:-latest}.zip"
        else
          ZIP_NAME="AK3_${OP_MODEL}_${TKERNEL_VER}-${ANDROID_VER}-${OP_UNAME}_${{ inputs.ksu_type }}_${KSUVER:-latest}.zip"
        fi

        if [ -n "${NOMOUNT_VERSION:-}" ]; then
          ZIP_NAME="${ZIP_NAME%.zip}_NoMount_${NOMOUNT_VERSION}.zip"
        fi

        zip -r9 "$ZIP_NAME" ./* -x "*.git*" -x "$ZIP_NAME" -x "README.md"
        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

        {
          echo "### ✅ ${OP_MODEL} (${{ inputs.ksu_type }})"
          echo "- **Kernel Uname:** \`${KERNEL_UNAME}\`"
          echo "- **KSU:** \`${{ inputs.ksu_type }} v${KSUVER:-unknown}\` (\`${KSU_COMMIT_SHA:0:8}\`)"
          echo "- **SUSFS:** \`${SUSVER:-none}\`"
          if [ "${OP_BBR3:-false}" = "true" ]; then
            echo '- **BBRv3:** built in (`bbr3`)'
          fi
          if [ -n "${NOMOUNT_VERSION:-}" ]; then
            echo "- **NoMount:** \`${NOMOUNT_VERSION}\`"
          fi
          echo "- **Artifact:** \`${ZIP_NAME}\`"
          echo "- **SHA256:** \`${ZIP_SHA256}\`"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: 📥 Checkout Code for Cache Save
      uses: actions/checkout@v6
      if: always() && steps.build_kernel_step.conclusion == 'success' && (inputs.clean == false || inputs.clean == 'false')
      with:
        path: main-source
        fetch-depth: 1

    - name: Save ccache
      if: always() && steps.build_kernel_step.conclusion == 'success' && (inputs.clean == false || inputs.clean == 'false')
      uses: ./action-source/.github/actions/cache/save
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v4-${{ env.OP_MODEL }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        github_token: ${{ inputs.github_token }}
        working_dir: "./main-source"
        compression_level: 6
